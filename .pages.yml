# Pages CMS visual editing config.
# ASTRA Content Management

media:
  input: assets
  output: /assets
content:
  - name: glossary
    label: Astronomy Glossary
    type: collection
    path: content/glossary
    format: json
    
    filename: "{primary}.json"
    
    exclude:
      - manifest.json
      
    view:
      primary: term
    fields:
      - name: term
        label: Term
        type: string
        required: true
        
      - name: category
        label: Category
        type: string
        
      - name: unit
        label: Unit
        type: number
        
      - name: level
        label: Level
        type: select
        options:
          values: [basic, expected, pro]
      
      - name: definition
        label: Definition
        type: text
        
      - name: related
        label: Related Concepts
        type: string
        list: true

      - name: moreResources
        label: More Resources
        type: object
        list: true
        fields:
          - name: title
            label: Resource Title
            type: string
          - name: url
            label: Resource URL
            type: string